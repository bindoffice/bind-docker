server {
    listen              443 ssl http2 default_server;
    listen              [::]:443 ssl http2;
    set                 $base /data/www/inbox;
    root                $base;

    # SSL
    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    # logging
    access_log          /var/log/nginx/inbox.access.log combined buffer=512k flush=1m;
    error_log           /var/log/nginx/inbox.error.log warn;

    # index.php
    index               index.html;


    # 方案二:后端用 BIND_OSS_ADDR(127.0.0.1:9000) 签 /{bucket}/{object},
    # 再把对外 URL 改成 /oss/{bucket}/{object}。Nginx 必须还原签名时的 Host 与路径。
    location ^~ /oss/ {
	    proxy_http_version 1.1;
	    proxy_buffering on;                  # 启用缓冲（如需缓存必须开启）

		# 1) 路径:proxy_pass 结尾斜杠剥离 /oss/,MinIO 收到 /drive/12345
		# 2) Host:必须与 BIND_OSS_ADDR / MINIO_ADDR 一致(默认 127.0.0.1:9000)
		proxy_set_header Host "127.0.0.1:9000";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Authorization $http_authorization;

		# MinIO 控制台在 /minio/ 下,把绝对跳转改成站内相对路径,交给下面
		# location ^~ /minio/ 原样转发。不要写 "proxy_redirect /minio/ /oss/",
		# 否则浏览器访问 /oss 会变成 /oss -> / -> /minio -> /oss 死循环。
		proxy_redirect http://127.0.0.1:9000/ /;
		proxy_redirect http://minioserver/ /;

		# Configure out caches
		proxy_cache S3-cache;
		proxy_buffers 8 16k;
		proxy_buffer_size 16k;
		proxy_busy_buffers_size 32k;

		# Do not convert HEAD into GET
		proxy_cache_convert_head off;

		proxy_cache_bypass $http_cachepurge;

		slice 1m; # 每 1MB 切片缓存一次
		proxy_set_header Range $slice_range;
		# Since head conversion is disabled, the request_method is included in the proxy_cache_key
		proxy_cache_key  "$scheme$host$request_method$uri$is_args$args$slice_range";

		# GET and HEAD are cached by default
		proxy_cache_methods GET HEAD;

		#  Cache all 200 OK's for 24 hours
		proxy_cache_valid  200 24h;

		# Use stale cache file in all errors from upstream if we can
		proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;

		#  Lock the cache so that only one request can populate it at a time
		proxy_cache_lock    on;
		proxy_cache_revalidate on;

		add_header             Cache-Control max-age=31536000;
		# Set back a nice HTTP Header to indicate what the cache status was
		add_header             X-Cache-Status $upstream_cache_status;

	    proxy_pass            http://minioserver/;
    }

    # MinIO(2021) 控制台挂在 /minio/ 下,必须原样转发,不能 rewrite 去掉前缀,
    # 否则 MinIO 路由不到控制台页面和 API。
    location ^~ /minio/ {
	    proxy_http_version 1.1;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Authorization $http_authorization;
	    proxy_pass            http://minioserver;
    }


    location ^~ /rtc {
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
        proxy_pass            http://meetserver/rtc;
    }

    location ^~ /bind-static {
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
        proxy_pass            http://staticserver/bind-static;
    }


    location / {

	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
        proxy_pass       http://webserver;
    }


}


server {
    listen              41883 ssl http2 default_server;
    listen              [::]:41883 ssl http2;
    set                 $base /data/www/inbox;
    root                $base;

    # SSL
    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    # logging
    access_log          /var/log/nginx/mqtt.access.log combined buffer=512k flush=1m;
    error_log           /var/log/nginx/mqtt.error.log warn;

    # index.php
    index               index.html;


    location  / {
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
	    proxy_buffering off;
	    proxy_pass            http://mqttserver;
    }
}


# HTTP redirect
server {
    listen      80 default_server;
    listen      [::]:80;
    set                 $base /data/www/inbox;
    root                $base;

    # logging
    access_log          /var/log/nginx/inbox.access.log combined buffer=512k flush=1m;
    error_log           /var/log/nginx/inbox.error.log warn;

    index               index.html;

    # 方案二:与 443 server 的 /oss/ 一致——剥离前缀并还原签名 Host。
    location ^~ /oss/ {
	    proxy_http_version 1.1;
	    proxy_set_header Host "127.0.0.1:9000";
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Authorization $http_authorization;
	    proxy_buffering off;
	    proxy_redirect http://127.0.0.1:9000/ /;
	    proxy_redirect http://minioserver/ /;
	    proxy_pass            http://minioserver/;
    }

    location ^~ /minio/ {
	    proxy_http_version 1.1;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Authorization $http_authorization;
	    proxy_pass            http://minioserver;
    }


    location ^~ /rtc {
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
	    proxy_pass            http://meetserver/rtc;
    }

    location ^~ /bind-static {
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
        proxy_pass            http://staticserver/bind-static;
    }



    location / {

	    proxy_http_version 1.1;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "Upgrade";
	    proxy_pass       http://webserver;
    }

    

}


